name: Validate CSV processor
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run core reliability tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate and verify the retained 10000-record demonstration
        run: python3 tools/large_case_demo.py --output runs/demo-10000
      - name: Reproduce ready, exception and blocked examples
        shell: bash
        run: |
          python3 process_export.py --input samples/valid.csv --output runs/valid
          python3 process_export.py --input samples/renamed_report.csv --output runs/renamed
          python3 process_export.py --input samples/bad_values.csv --output runs/exceptions
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open(newline='') as handle:
                  return list(csv.DictReader(handle))
          expected = rows('samples/expected/cleaned_valid.csv')
          for name in ['valid', 'renamed']:
              assert rows(f'runs/{name}/cleaned.csv') == expected
              assert Path(f'runs/{name}/READY').is_file()
          assert Path('runs/exceptions/READY_WITH_EXCEPTIONS').is_file()
          assert [r['customer_id'] for r in rows('runs/exceptions/cleaned.csv')] == ['F001', 'F004']
          assert len(rows('runs/exceptions/rejected.csv')) == 2
          assert Path('runs/exceptions/received.csv').read_bytes() == Path('samples/bad_values.csv').read_bytes()
          PY
          set +e
          python3 process_export.py --input samples/breaking_change.csv --output runs/blocked
          result=$?
          set -e
          test "$result" -eq 3
          test -f runs/blocked/BLOCKED
          test ! -e runs/blocked/cleaned.csv
