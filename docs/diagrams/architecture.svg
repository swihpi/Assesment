<rect x="305" y="170" width="260" height="75" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3"/>
<text x="435.0" y="200" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">Profile quality checks</text>
<polyline points="264,207 305,207" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#a)"/>
