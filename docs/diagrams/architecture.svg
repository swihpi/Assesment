<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Wider audience-data concept: database and analytics have distinct roles</title><desc id="desc">Social, CRM and purchase information undergo source-specific processing. Database (ADW) stores the customer-held data. Analytics (OAC) presents dashboards for analyst review and audience decisions. Only the local CRM file checks are implemented.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637880"/></marker></defs><rect width="1100" height="470" rx="14" fill="#fbfcfa"/>
<text x="550" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#40857b">WIDER AUDIENCE-DATA CONCEPT</text>
<rect x="24" y="65" width="240" height="75" rx="9" fill="#f1f4f3" stroke="#829b9f" stroke-width="1.3"/>
<text x="144.0" y="95" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">Social posts / game context</text>
