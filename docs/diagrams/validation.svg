<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Implemented local receiving and record-level validation</title><desc id="desc">Preserve received CSV, check its contract, normalize records, release valid records and report correction cases. Structural input failures block every approval. A final success marker is required before using approved output.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637880" /></marker></defs><rect width="1000" height="650" rx="14" fill="#fbfcfa" />
<text x="500" y="28" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#40857b">IMPLEMENTED LOCAL FLOW</text>
<rect x="150" y="48" width="600" height="82" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3" />
<text x="450.0" y="76" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">Keep the original file</text>
<text x="450.0" y="101" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">Unchanged received.csv copy; source file not edited</text>
<polyline points="450,130 450,169" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#a)" />
<rect x="150" y="169" width="600" height="82" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3" />
<text x="450.0" y="197" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">Check the file can be read</text>
<text x="450.0" y="222" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">Required headings, file format and encoding</text>
<polyline points="750,210 855,210 855,290" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#a)" />
<text x="815" y="197" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17363d">Cannot read</text>
<rect x="760" y="290" width="215" height="125" rx="9" fill="#faf1e4" stroke="#a47530" stroke-width="1.3" />
<text x="867.5" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">Stop processing</text>
<text x="867.5" y="343" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">No cleaned.csv</text>
<text x="867.5" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">Original file and</text>
<text x="867.5" y="387" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">diagnostics retained</text>
<polyline points="450,251 450,289" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#a)" />
<text x="485" y="275" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17363d">Readable</text>
<rect x="150" y="289" width="550" height="100" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3" />
<text x="425.0" y="317" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">Check and standardise each record</text>
<text x="425.0" y="342" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">Agreed mappings, required values and repeated IDs</text>
<text x="425.0" y="364" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">Keep permission meanings; remove identical valid copies</text>
<polyline points="425,389 425,422 242,422 242,455" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#a)" />
<polyline points="425,422 630,422 630,455" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#a)" />
<rect x="25" y="455" width="435" height="96" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3" />
<text x="242.5" y="483" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">APPROVED RECORDS</text>
<text x="242.5" y="508" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">cleaned.csv: valid records only</text>
<text x="242.5" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">Records that passed the checks</text>
<rect x="480" y="455" width="495" height="96" rx="9" fill="#faf1e4" stroke="#a47530" stroke-width="1.3" />
<text x="727.5" y="483" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17363d">CORRECTION CASES</text>
<text x="727.5" y="508" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">rejected.csv + record_status.csv</text>
<text x="727.5" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#17363d">One bad record need not stop the others</text>
<text x="500" y="588" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#17363d">Reports show what happened to each record. No valid records means no approved file.</text>
<text x="500" y="620" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#17363d" />
</svg>