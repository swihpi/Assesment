<text x="450.0" y="102" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Customer-controlled location</text>
<rect x="626" y="52" width="250" height="75" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3"/>
<text x="751.0" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17363d">Oracle Integration Cloud</text>
<text x="751.0" y="102" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Retrieval &amp; orchestration</text>
<polyline points="274,90 325,90" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="575,90 626,90" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="751,127 751,157 450,157 450,183" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#arrow)"/>
