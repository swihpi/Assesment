<text x="450.0" y="210" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17363d">Preserve the original file</text>
<text x="450.0" y="233" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Proposed archive: OCI Object Storage</text>
<text x="450.0" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Exact bytes and batch reference; restricted access</text>
<polyline points="450,273 450,311" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="180" y="311" width="540" height="113" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3"/>
<text x="450.0" y="338" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17363d">Validate &amp; normalize BEFORE ADW loading</text>
<text x="450.0" y="361" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">OIC mappings or proposed Python OCI Function</text>
<text x="450.0" y="382" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Required fields, dates, permission and identity rules</text>
<text x="450.0" y="403" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Unreliable input → BLOCKED; retain raw file and report</text>
<polyline points="450,424 450,451 234,451 234,483" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="450,451 666,451 666,483" fill="none" stroke="#637880" stroke-width="1.6" marker-end="url(#arrow)"/>
