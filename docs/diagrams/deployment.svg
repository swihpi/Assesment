<text x="666.0" y="510" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17363d">ADW: CORRECTION CASES</text>
<text x="666.0" y="533" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">NEEDS_CORRECTION + reason</text>
<text x="666.0" y="554" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Restricted source values; excluded from approved use</text>
<text x="234" y="617" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#17363d">Apply current channel / purpose eligibility</text>
<text x="234" y="640" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17363d">UNKNOWN or NO does not authorise sending</text>
<text x="666" y="617" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#17363d">Exception report → source owner</text>
<text x="666" y="640" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17363d">Correct at source → re-export → revalidate</text>
<text x="450" y="682" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#17363d">Customer-record loads follow classification; cloud components remain proposed.</text>
