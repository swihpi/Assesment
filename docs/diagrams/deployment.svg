<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="title desc"><title id="title">Validate before loading ADW</title><desc id="desc">OIC retrieves the CSV from SFTP, archives the original file, coordinates validation, then loads approved records and restricted correction cases into ADW. Uninterpretable files are archived but no customer rows are approved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#637880"/></marker></defs><rect width="900" height="710" rx="14" fill="#fbfcfa"/>
<text x="450" y="29" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#40857b">PROPOSED PRODUCTION FLOW</text>
<rect x="24" y="52" width="250" height="75" rx="9" fill="#eaf3f0" stroke="#40857b" stroke-width="1.3"/>
<text x="149.0" y="79" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#17363d">CRM reporting</text>
<text x="149.0" y="102" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Completed daily CSV export</text>
