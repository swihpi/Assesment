<text x="234.0" y="533" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">ACCEPTED / ACCEPTED_WITH_WARNING</text>
<text x="234.0" y="554" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#17363d">Only records that passed the required checks</text>
